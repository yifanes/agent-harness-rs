[package]
name = "agent-harness-rs"
version = "0.2.8"
edition = "2021"
authors = ["yifanes"]
license = "MIT"
description = "Agent loop harness with local and sandbox tool runtimes, context management, and MCP support"
repository = "https://github.com/yifanes/agent-harness-rs"
homepage = "https://github.com/yifanes/agent-harness-rs"
documentation = "https://docs.rs/agent-harness-rs"
keywords = ["agent", "llm", "tool-calling", "mcp", "e2b"]
categories = ["asynchronous", "api-bindings"]
readme = "README.md"

[lib]
name = "harness"   # import as: use harness::...

[dependencies]
async-trait        = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
tokio              = { version = "1", features = ["full"] }
tokio-stream       = "0.1"
tokio-util         = { version = "0.7", features = ["rt"] }
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dirs               = "5"
futures            = "0.3"
eventsource-stream = "0.2"
tracing            = "0.1"
uuid               = { version = "1", features = ["v4"] }
base64             = "0.22"
libc               = "0.2"
ignore             = "0.4"

# e2b feature: Connect Protocol to envd
prost   = { version = "0.13", optional = true }
bytes   = { version = "1",    optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
prost-build = { version = "0.13", optional = true }

[features]
default = ["local-tools"]
local-tools = []
e2b = ["dep:prost", "dep:bytes", "dep:prost-build"]
